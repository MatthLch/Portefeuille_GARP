<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portefeuille modèle GARP</title>
<meta name="description" content="Portefeuille modèle Quality Growth / GARP : positions, journal des décisions, backtest et méthodologie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,400;7..72,500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout : dossier de recherche. Bandeau d'identité, onglets façon intercalaires,
   tableaux denses à chiffres tabulaires, fiche valeur en tiroir latéral. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --ink: #141c29;
  --muted: #5a6475;
  --line: #dde1e8;
  --line-strong: #c3c9d3;
  --accent: #3140a6;
  --accent-soft: #e8eaf8;
  --pos: #187647;
  --neg: #b3202d;
  --warn: #9a6500;
  --chart-bench: #9aa3b2;
  --shadow: 0 18px 50px rgba(20, 28, 41, .18);

  --f-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-prose: "Literata", Georgia, "Times New Roman", serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --s-xs: .75rem; --s-sm: .8125rem; --s-base: .9375rem; --s-md: 1.0625rem;
  --s-lg: 1.375rem; --s-xl: 1.875rem; --s-xxl: clamp(2rem, 4.5vw, 2.875rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #151c26; --ink: #e5e9ef; --muted: #96a0af;
    --line: #253041; --line-strong: #344155; --accent: #93a0ff; --accent-soft: #1e2647;
    --pos: #4cc38a; --neg: #ff6b76; --warn: #e2b04a; --chart-bench: #5d6879;
    --shadow: 0 18px 50px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c26; --ink: #e5e9ef; --muted: #96a0af;
  --line: #253041; --line-strong: #344155; --accent: #93a0ff; --accent-soft: #1e2647;
  --pos: #4cc38a; --neg: #ff6b76; --warn: #e2b04a; --chart-bench: #5d6879;
  --shadow: 0 18px 50px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 var(--s-base)/1.55 var(--f-ui);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px;
}
.wrap { max-width: 1140px; margin: 0 auto; padding-inline: 20px; }
.num, td.n, .mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.muted { color: var(--muted); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.eyebrow {
  font: 600 var(--s-xs)/1.2 var(--f-ui); letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
}

/* ---- Bandeau ---- */
.masthead { padding-block: 40px 0; border-bottom: 1px solid var(--line); background: var(--surface); }
.masthead-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: end; }
.masthead h1 { font-size: var(--s-xxl); font-weight: 700; letter-spacing: -.02em; line-height: 1.05; margin-top: 10px; }
.masthead .role { font-size: var(--s-md); color: var(--muted); margin-top: 6px; }
.masthead .pitch { font-family: var(--f-prose); font-size: var(--s-md); max-width: 62ch; margin: 18px 0 0; }
.vl-card { border-left: 1px solid var(--line); padding-left: 28px; min-width: 230px; }
.vl-card .big { font: 500 2.25rem/1 var(--f-data); letter-spacing: -.02em; margin: 8px 0 6px; }
.vl-card .vs { font-size: var(--s-sm); color: var(--muted); }
.vl-card .vs b { font-weight: 500; font-family: var(--f-data); }
.vl-card .asof { font-size: var(--s-xs); color: var(--muted); margin-top: 10px; }
.tag-fictif {
  display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line-strong);
  border-radius: 999px; padding: 3px 10px; font-size: var(--s-xs); color: var(--muted); font-weight: 500;
}
.tag-fictif::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

nav.tabs { display: flex; gap: 4px; margin-top: 32px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a {
  flex: none; text-decoration: none; color: var(--muted); font-weight: 500; font-size: var(--s-base);
  padding: 10px 16px 12px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0;
  margin-bottom: -1px;
}
nav.tabs a:hover { color: var(--ink); }
nav.tabs a[aria-current="page"] { color: var(--ink); background: var(--bg); border-color: var(--line); }

.demo-banner {
  background: var(--accent-soft); color: var(--ink); font-size: var(--s-sm);
  padding-block: 9px; border-bottom: 1px solid var(--line);
}
.demo-banner b { font-weight: 600; }

main { padding-block: 36px 64px; }
section.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; }
section.view > * { min-width: 0; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head h2 { font-size: var(--s-lg); font-weight: 600; letter-spacing: -.01em; }
.sec-head p { margin: 0; color: var(--muted); font-size: var(--s-sm); }
.lede { font-family: var(--f-prose); font-size: var(--s-md); max-width: 68ch; margin: 0; }

/* ---- Indicateurs ---- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.kpi { padding: 18px 20px; display: grid; gap: 6px; align-content: start; }
.kpi + .kpi { border-left: 1px solid var(--line); }
.kpi .v { font: 500 1.625rem/1.1 var(--f-data); letter-spacing: -.01em; }
.kpi .d { font-size: var(--s-sm); color: var(--muted); }

/* ---- Graphiques ---- */
.chart-box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 18px 10px; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: var(--s-sm); color: var(--muted); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 18px; height: 2px; background: var(--accent); display: inline-block; }
.legend i.b { background: var(--chart-bench); }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--muted); font: 400 11px var(--f-data); }
.chart .l-main { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .l-bench { fill: none; stroke: var(--chart-bench); stroke-width: 1.5; }
.chart .a-main { fill: var(--accent); opacity: .08; }
.chart .base { stroke: var(--line-strong); stroke-dasharray: 3 3; }
.chart .dot { fill: var(--accent); }
.chart .cursor { stroke: var(--line-strong); }
.chart .bar-s { fill: var(--accent); } .chart .bar-b { fill: var(--chart-bench); }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 6px; padding: 7px 10px; font-size: var(--s-xs); box-shadow: var(--shadow); white-space: nowrap;
  font-family: var(--f-data); transform: translate(-50%, -110%);
}

/* ---- Tableaux ---- */
.table-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: var(--s-sm); }
th { text-align: left; font-weight: 600; font-size: var(--s-xs); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th.n, td.n { text-align: right; white-space: nowrap; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--accent-soft); }
.co { display: grid; gap: 2px; min-width: 190px; }
.co b { font-weight: 600; font-size: var(--s-base); }
.co small { color: var(--muted); font-size: var(--s-xs); }
.tk { font-family: var(--f-data); font-size: var(--s-xs); color: var(--muted); }
.sub { display: block; font-size: var(--s-xs); color: var(--muted); }

.gem { display: inline-grid; grid-template-columns: repeat(4, 7px); gap: 2px; align-items: end; height: 20px; margin-right: 8px; vertical-align: middle; }
.gem i { display: block; background: var(--accent); border-radius: 1px; }
.checks { display: inline-flex; gap: 4px; }
.check {
  width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center;
  font-size: 11px; font-weight: 700; border: 1px solid var(--pos); color: var(--pos);
}
.check.ko { border-color: var(--neg); color: var(--neg); }
.rule-note { font-size: var(--s-xs); color: var(--muted); margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; }

/* ---- Journal ---- */
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font: 500 var(--s-sm)/1 var(--f-ui); padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.timeline { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.month { padding: 14px 20px 6px; font-weight: 600; font-size: var(--s-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-top: 1px solid var(--line); }
.month:first-child { border-top: 0; }
.entry { display: grid; grid-template-columns: 92px 96px minmax(0, 1fr); gap: 16px; padding: 14px 20px; }
.entry + .entry { border-top: 1px dashed var(--line); }
.entry .date { font-family: var(--f-data); font-size: var(--s-sm); color: var(--muted); padding-top: 2px; }
.type { justify-self: start; font-size: var(--s-xs); font-weight: 600; padding: 3px 9px; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--muted); height: fit-content; }
.type.t-entree { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.type.t-sortie { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.type.t-ecarte { border-style: dashed; }
.entry h3 { font-size: var(--s-base); font-weight: 600; }
.entry h3 .tk { margin-left: 6px; font-weight: 400; }
.entry p { margin: 4px 0 0; font-family: var(--f-prose); font-size: var(--s-base); max-width: 72ch; }
.entry button.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: var(--s-sm); margin-top: 6px; }
.proof { font-size: var(--s-sm); color: var(--muted); }

/* ---- Backtest & méthode ---- */
.callout { border: 1px solid var(--line); border-left: 3px solid var(--accent); background: var(--surface); padding: 16px 20px; border-radius: 4px 10px 10px 4px; }
.callout p { margin: 6px 0 0; font-family: var(--f-prose); max-width: 75ch; }
.two > div, .about > div { min-width: 0; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
ul.plain, ol.plain { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; font-family: var(--f-prose); max-width: 72ch; }
ul.plain li::marker { color: var(--muted); }
.limits { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; }
.limits h2 { font-size: var(--s-lg); font-weight: 600; margin-bottom: 4px; }
.limits > p { margin: 0 0 14px; color: var(--muted); font-size: var(--s-sm); }
.sens td.best { font-weight: 600; }

.steps { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.step { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 18px; padding: 22px 24px; }
.step + .step { border-top: 1px solid var(--line); }
.step > div { min-width: 0; }
.step .no { font: 500 var(--s-xl)/1 var(--f-data); color: var(--accent); }
.step h3 { font-size: var(--s-md); font-weight: 600; }
.step p { margin: 6px 0 0; font-family: var(--f-prose); max-width: 70ch; }
.thresholds { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 14px; }
.thr { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.thr .k { font-size: var(--s-xs); color: var(--muted); }
.thr .v { font: 500 var(--s-md) var(--f-data); }
.pillars { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.pillar { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.pillar b { font-weight: 600; display: block; margin-bottom: 4px; }
.pillar span { font-size: var(--s-sm); color: var(--muted); }

.about { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; }
.contact { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; display: grid; gap: 14px; align-content: start; }
.contact .row { display: grid; gap: 4px; }
.copy-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copy-row .mono { user-select: all; font-size: var(--s-sm); overflow-wrap: anywhere; }
.btn {
  font: 500 var(--s-sm)/1 var(--f-ui); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; gap: 6px; align-items: center;
}
.btn:hover { border-color: var(--ink); }
.disclaimer { font-size: var(--s-sm); color: var(--muted); max-width: 80ch; }

footer { border-top: 1px solid var(--line); padding-block: 22px 40px; font-size: var(--s-xs); color: var(--muted); }
footer p { margin: 0; max-width: 95ch; }

/* ---- Fiche valeur ---- */
.backdrop { position: fixed; inset: 0; background: rgba(10, 14, 20, .38); z-index: 20; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); z-index: 21;
  background: var(--bg); box-shadow: var(--shadow); overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 22px) 26px calc(env(safe-area-inset-bottom, 0px) + 40px);
  display: grid; gap: 26px; align-content: start; grid-auto-rows: max-content;
}
.drawer-head { display: flex; justify-content: space-between; gap: 16px; align-items: start; }
.drawer-head h2 { font-size: var(--s-xl); font-weight: 700; letter-spacing: -.015em; }
.drawer-head .meta { color: var(--muted); font-size: var(--s-sm); margin-top: 4px; }
.close { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 18px; cursor: pointer; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.fact { background: var(--surface); padding: 12px 14px; display: grid; gap: 3px; }
.fact .k { font-size: var(--s-xs); color: var(--muted); }
.fact .v { font: 500 var(--s-md) var(--f-data); }
.block h3 { font-size: var(--s-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.block p { margin: 0; font-family: var(--f-prose); font-size: var(--s-md); }
.scale { position: relative; height: 54px; margin: 8px 6px 4px; }
.scale .track { position: absolute; left: 0; right: 0; top: 24px; height: 6px; border-radius: 3px; background: var(--line); }
.scale .zone { position: absolute; top: 24px; height: 6px; background: var(--pos); opacity: .35; border-radius: 3px 0 0 3px; }
.scale .mk { position: absolute; top: 0; transform: translateX(-50%); display: grid; justify-items: center; gap: 4px; font-size: 11px; font-family: var(--f-data); white-space: nowrap; }
.scale .mk i { width: 2px; height: 30px; background: var(--ink); display: block; }
.scale .mk.th i { background: var(--muted); }
.scale .mk.lbl-below { top: 22px; }
.scale .mk.lbl-below i { height: 12px; }
.scale-caption { font-size: var(--s-sm); color: var(--muted); margin-top: 6px; }
.gem-rows { display: grid; gap: 8px; }
.gem-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 34px; gap: 12px; align-items: center; font-size: var(--s-sm); }
.gem-row .bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.gem-row .bar i { height: 8px; border-radius: 2px; background: var(--line); }
.gem-row .bar i.on { background: var(--accent); }
.gem-total { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 2px; font-weight: 600; font-size: var(--s-sm); }
.invalid li::marker { content: "✕  "; color: var(--neg); }
.exit { border: 1px solid var(--line-strong); border-radius: 8px; padding: 12px 14px; background: var(--surface); }

.empty { padding: 28px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 10px; }
.err { padding: 18px; border: 1px solid var(--neg); color: var(--neg); border-radius: 10px; background: var(--surface); }


/* ---- Construction ---- */
.tally { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tally > div { padding: 16px 18px; display: grid; gap: 4px; align-content: start; }
.tally > div + div { border-left: 1px solid var(--line); }
.tally .v { font: 500 1.75rem/1.1 var(--f-data); }
.tally .d { font-size: var(--s-sm); color: var(--muted); }
.board { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
.board-col { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 18px; display: grid; gap: 14px; align-content: start; }
.board-col h3 { font-size: var(--s-md); font-weight: 600; }
.board-col h3 small { font-weight: 400; color: var(--muted); font-size: var(--s-sm); margin-left: 6px; }
.grp { display: grid; gap: 7px; }
.grp-t { font-size: var(--s-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.co-chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: var(--s-sm); padding: 4px 9px 4px 7px;
  border-radius: 5px; border: 1px solid var(--line-strong); background: var(--bg); line-height: 1.3;
}
.co-chip::before { content: "✓"; font-size: 11px; font-weight: 700; color: var(--pos); width: 12px; text-align: center; }
.co-chip.err { border-color: var(--neg); }
.co-chip.err::before { content: "✕"; color: var(--neg); }
.co-chip.q { border-style: dashed; color: var(--muted); }
.co-chip.q::before { content: "?"; color: var(--warn); }
.co-chip.na { border-style: dotted; color: var(--muted); }
.co-chip.na::before { content: "–"; color: var(--muted); }
.legend-chips { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--s-sm); color: var(--muted); }
.legend-chips .co-chip { pointer-events: none; }
.mode-note { font-size: var(--s-xs); color: var(--muted); margin-top: -2px; }
.lessons { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.lesson { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 20px; padding: 18px 22px; }
.lesson + .lesson { border-top: 1px solid var(--line); }
.lesson h3 { font-size: var(--s-base); font-weight: 600; }
.lesson .ex { font-size: var(--s-xs); color: var(--muted); margin-top: 4px; font-family: var(--f-data); }
.lesson p { margin: 0; font-family: var(--f-prose); max-width: 68ch; }
.lesson p + p { margin-top: 8px; }
.lesson .fix { color: var(--ink); }
.lesson .fix b { font-family: var(--f-ui); font-size: var(--s-xs); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-right: 6px; }
.open-cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.case { border: 1px solid var(--line); border-top: 3px solid var(--warn); border-radius: 4px 4px 10px 10px; background: var(--surface); padding: 16px 18px; display: grid; gap: 8px; align-content: start; }
.case h3 { font-size: var(--s-base); font-weight: 600; }
.case p { margin: 0; font-family: var(--f-prose); font-size: var(--s-base); }
@media (max-width: 900px) {
  .board, .open-cases { grid-template-columns: 1fr; }
  .tally { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tally > div:nth-child(3) { border-left: 0; }
  .tally > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .lesson { grid-template-columns: 1fr; gap: 8px; }
}

@media (max-width: 900px) {
  .masthead-grid { grid-template-columns: 1fr; }
  .vl-card { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 18px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(3) { border-left: 0; }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
  .two, .about { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .wrap { padding-inline: 16px; }
  .masthead { padding-block: 26px 0; }
  .entry { grid-template-columns: 1fr; gap: 6px; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pillars { grid-template-columns: 1fr; }
  .step { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .drawer { padding-inline: 18px; }
  .gem-row { grid-template-columns: minmax(0, 1fr) 90px 30px; }
}
/* Positions : une carte par ligne sur petit écran, au lieu d'un tableau tronqué */
@media (max-width: 640px) {
  table.positions thead { display: none; }
  table.positions, table.positions tbody { display: block; }
  table.positions tr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; padding: 16px; border-bottom: 1px solid var(--line); }
  table.positions tr:last-child { border-bottom: 0; }
  table.positions td { display: grid; gap: 3px; align-content: start; justify-items: start; padding: 0; border: 0; text-align: left; white-space: normal !important; }
  table.positions td.c-co { grid-column: 1 / -1; }
  table.positions td.c-co .co { min-width: 0; }
  table.positions td[data-label]::before {
    content: attr(data-label); font: 600 10px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  }
  table.positions .sub { display: block; }
}
/* Onglets : sur mobile, un dégradé signale qu'on peut faire défiler */
.tabs-wrap { position: relative; }
@media (max-width: 760px) {
  .tabs-wrap::after {
    content: ""; position: absolute; right: -1px; top: 32px; bottom: 1px; width: 40px; pointer-events: none;
    background: linear-gradient(to right, transparent, var(--surface));
  }
  .tabs-wrap.fin::after { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide .22s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="masthead-grid">
      <div>
        <span class="tag-fictif">Portefeuille modèle · capital fictif</span>
        <h1 id="nom">Portefeuille modèle</h1>
        <div class="role" id="role"></div>
        <p class="pitch" id="pitch"></p>
      </div>
      <div class="vl-card" id="vlcard" aria-live="polite"></div>
    </div>
    <div class="tabs-wrap"><nav class="tabs" aria-label="Sections">
      <a href="#portefeuille" data-view="portefeuille">Portefeuille</a>
      <a href="#journal" data-view="journal">Journal des décisions</a>
      <a href="#methode" data-view="methode">Méthode</a>
      <a href="#construction" data-view="construction">Construction</a>
      <a href="#backtest" data-view="backtest">Backtest</a>
      <a href="#apropos" data-view="apropos">À propos</a>
    </nav></div>
  </div>
</header>
<div class="demo-banner" id="demo" hidden><div class="wrap"><b>Données d'exemple.</b> <span id="demo-txt"></span></div></div>

<main class="wrap">
  <section class="view" id="v-portefeuille"></section>
  <section class="view" id="v-journal" hidden></section>
  <section class="view" id="v-backtest" hidden></section>
  <section class="view" id="v-methode" hidden></section>
  <section class="view" id="v-construction" hidden></section>
  <section class="view" id="v-apropos" hidden></section>
</main>

<footer>
  <div class="wrap"><p id="footer-txt"></p></div>
</footer>

<div class="backdrop" id="backdrop" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="fiche-titre" hidden></aside>

<script>
(() => {
"use strict";

/* ------------------------------------------------------------------ */
/* Données                                                             */
/* ------------------------------------------------------------------ */
const FICHIERS = ["site", "portfolio", "journal", "marche", "backtest"];
const D = {};

const nf = (d = 0) => new Intl.NumberFormat("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmt = (v, d = 0) => (v == null || isNaN(v)) ? "—" : nf(d).format(v);
const pct = (v, d = 1, signe = true) => (v == null || isNaN(v)) ? "—" : (signe && v > 0 ? "+" : "") + nf(d).format(v) + " %";
const cls = v => v > 0 ? "pos" : v < 0 ? "neg" : "";
const dfr = s => { if (!s) return "—"; const [y, m, d] = s.split("-"); return `${d}/${m}/${y}`; };
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const devise = d => d === "GBX" ? "p" : d;
const prix = (v, d) => {
  if (v == null || isNaN(v)) return "—";
  const dec = v >= 1000 ? 0 : v >= 100 ? 1 : 2;
  return fmt(v, dec) + " " + devise(d);
};
const slug = t => String(t).replace(/[^A-Za-z0-9._~-]/g, "_");

const notesGem = p => [p.gem_moat, p.gem_management, p.gem_reinvestissement, p.gem_transparence].map(v => +v || 0);
function gemTotal(p) { return notesGem(p).reduce((a, b) => a + b, 0); }
/* Rendement exigé selon le score Gem (null si le score est sous le seuil). */
function rdtExige(score) {
  const defaut = [{ score_min: 18, rendement_pct: 8 }, { score_min: 16, rendement_pct: 9 }, { score_min: 15, rendement_pct: 10 }];
  const grille = ((D.site.rendements_exiges || []).length ? D.site.rendements_exiges : defaut).slice().sort((a, b) => b.score_min - a.score_min);
  const r = grille.find(x => score >= x.score_min - 1e-9);
  return r ? r.rendement_pct : null;
}
const rdtImplicite = p => (p.rendement_implicite_pct === "" || p.rendement_implicite_pct == null) ? null : +p.rendement_implicite_pct;
/* Écart entre le cours d'exécution et le cours auquel le reverse DCF a été calculé. */
function deriveDcf(p) {
  const c = +p.cours_entree, d = +p.cours_dcf;
  return c && d ? c / d - 1 : null;
}
const fmtG = g => fmt(g, Number.isInteger(+g) ? 0 : 1);
const PHASES = {
  A: { nom: "Accélération", decision: "Ligne pleine" },
  P: { nom: "Pause", decision: "Tranche réduite" },
  C: { nom: "Controverse", decision: "Tranche réduite" },
  B: { nom: "Baisse", decision: "Aucun achat" },
};
function regles(p) {
  const s = D.site, g = gemTotal(p), plancher = s.plancher_pilier ?? 3;
  const exig = rdtExige(g), impl = rdtImplicite(p), der = deriveDcf(p);
  const seuilDer = (s.ecart_recalcul_pct ?? 10) / 100;
  const retenu = g >= s.seuil_gem - 1e-9 && notesGem(p).every(n => n >= plancher) && p.vetos_ok !== false;
  const ph = PHASES[p.phase] ? p.phase : null;
  let lblRdt;
  if (exig == null) lblRdt = "Rendement : score sous le seuil";
  else if (impl == null) lblRdt = "Rendement implicite non renseigné";
  else if (der != null && Math.abs(der) >= seuilDer) lblRdt = `Reverse DCF à recalculer : le cours a bougé de ${pct(der * 100, 0)} depuis le calcul`;
  else lblRdt = `Rendement implicite de ${fmt(impl, 1)} % pour ${exig} % exigés (Gem ${fmtG(g)}/20)`;
  return [
    { ok: retenu, lbl: `Gem retenu : ${fmtG(g)}/20 (seuil ${s.seuil_gem}), aucun pilier sous ${plancher}, aucun veto` },
    { ok: exig != null && impl != null && impl >= exig - 1e-9 && !(der != null && Math.abs(der) >= seuilDer), lbl: lblRdt },
    { ok: ph != null && ph !== "B", lbl: ph ? `Phase ${ph} · ${PHASES[ph].nom} : ${PHASES[ph].decision.toLowerCase()}` : "Phase de momentum non renseignée" },
  ];
}
const mk = p => (D.marche.positions || {})[p.ticker] || {};

/* ------------------------------------------------------------------ */
/* Graphique linéaire                                                  */
/* ------------------------------------------------------------------ */
function niceTicks(min, max, n = 5) {
  const span = max - min || 1, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const t = []; for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) t.push(+v.toFixed(6));
  return t;
}
function lineChart(el, dates, main, bench, opts = {}) {
  const draw = () => {
    const W = Math.max(300, el.clientWidth), H = opts.h || (W < 520 ? 220 : 280);
    const m = { t: 12, r: 14, b: 28, l: 44 };
    const all = main.concat(bench).filter(v => v != null);
    let lo = Math.min(...all, 100), hi = Math.max(...all, 100);
    const pad = (hi - lo) * .08 || 1; lo -= pad; hi += pad;
    // Série courte ou très plate : échelle d'au moins ±1 % autour de la base, pour ne pas grossir le bruit.
    if (hi - lo < 2) { const c = (hi + lo) / 2; lo = Math.min(lo, c - 1); hi = Math.max(hi, c + 1); }
    const ticks = niceTicks(lo, hi, 5); lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
    const pas = ticks.length > 1 ? ticks[1] - ticks[0] : 1, dec = pas >= 1 ? 0 : pas >= .1 ? 1 : 2;
    const n = dates.length, x = i => m.l + (n < 2 ? 0 : i / (n - 1)) * (W - m.l - m.r);
    const y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
    const path = arr => arr.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join("");
    // repères de dates : début de mois (ou d'année si la série est longue)
    const duree = n > 0 ? (new Date(dates[n - 1]) - new Date(dates[0])) / 864e5 : 0;
    const longue = duree > 3 * 365, courte = duree <= 92;
    const xt = []; let prev = "";
    dates.forEach((d, i) => { const k = courte ? d : longue ? d.slice(0, 4) : d.slice(0, 7); if (k !== prev) { xt.push([i, k]); prev = k; } });
    const every = Math.ceil(xt.length / Math.max(2, Math.floor((W - 60) / 70)));
    const xlab = k => courte ? k.slice(8, 10) + "/" + k.slice(5, 7) : longue ? k : MOIS[+k.slice(5, 7) - 1].slice(0, 4).replace(/\.$/, "") + (k.slice(5, 7) === "01" ? " " + k.slice(2, 4) : "");
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Graphique")}">`;
    s += `<g class="grid">${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>`;
    s += `<g class="axis">${ticks.map(t => `<text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t, dec)}</text>`).join("")}`;
    s += xt.filter((_, j) => j % every === 0).map(([i, k]) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${xlab(k)}</text>`).join("") + `</g>`;
    s += `<line class="base" x1="${m.l}" x2="${W - m.r}" y1="${y(100)}" y2="${y(100)}"/>`;
    if (main.length) s += `<path class="a-main" d="${path(main)}L${x(n - 1)},${y(lo)}L${x(0)},${y(lo)}Z"/>`;
    if (bench.length) s += `<path class="l-bench" d="${path(bench)}"/>`;
    if (main.length) s += `<path class="l-main" d="${path(main)}"/><circle class="dot" cx="${x(n - 1)}" cy="${y(main[n - 1])}" r="3.5"/>`;
    s += `<line class="cursor" id="cur" y1="${m.t}" y2="${H - m.b}" x1="-10" x2="-10"/>`;
    s += `<rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;
    el.innerHTML = s;
    const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), cur = el.querySelector("#cur");
    const move = ev => {
      const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
      const i = Math.max(0, Math.min(n - 1, Math.round((px - m.l) / (W - m.l - m.r) * (n - 1))));
      cur.setAttribute("x1", x(i)); cur.setAttribute("x2", x(i));
      tip.hidden = false;
      tip.style.left = (x(i) / W * r.width) + "px"; tip.style.top = (y(main[i] ?? bench[i]) / H * r.height) + "px";
      const var100 = v => v == null ? "—" : pct(v - 100, Math.abs(v - 100) < 10 ? 2 : 1);
      tip.innerHTML = `<b>${dfr(dates[i])}</b><br>${esc(opts.nMain || "Portefeuille")} <span class="${cls(main[i] - 100)}">${var100(main[i])}</span>` + (bench.length ? `<br>${esc(opts.nBench || "Benchmark")} <span class="${cls(bench[i] - 100)}">${var100(bench[i])}</span>` : "");
    };
    svg.addEventListener("pointermove", move);
    svg.addEventListener("pointerleave", () => { tip.hidden = true; cur.setAttribute("x1", -10); cur.setAttribute("x2", -10); });
  };
  draw();
  let raf; new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }).observe(el);
}
function barChart(el, rows) {
  const draw = () => {
    const W = Math.max(300, el.clientWidth), H = W < 520 ? 200 : 240, m = { t: 12, r: 10, b: 26, l: 40 };
    const vals = rows.flatMap(r => [r.strategie_pct, r.benchmark_pct]);
    const ticks = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals), 4);
    const lo = Math.min(ticks[0], ...vals), hi = Math.max(ticks[ticks.length - 1], ...vals);
    const y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
    const bw = (W - m.l - m.r) / rows.length, w = Math.min(14, bw * .32);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Performances annuelles">`;
    s += `<g class="grid">${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g><g class="axis">`;
    s += ticks.map(t => `<text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t, 0)}</text>`).join("");
    s += rows.map((r, i) => `<text x="${m.l + bw * i + bw / 2}" y="${H - 8}" text-anchor="middle">${W < 520 ? "’" + String(r.annee).slice(2) : r.annee}</text>`).join("") + "</g>";
    rows.forEach((r, i) => {
      const cx = m.l + bw * i + bw / 2;
      [["bar-s", r.strategie_pct, cx - w - 1], ["bar-b", r.benchmark_pct, cx + 1]].forEach(([c, v, x0]) => {
        const y0 = y(Math.max(0, v)), h = Math.abs(y(v) - y(0));
        s += `<rect class="${c}" x="${x0}" y="${y0}" width="${w}" height="${Math.max(h, 1)}" rx="1"><title>${r.annee} : ${pct(v)}</title></rect>`;
      });
    });
    s += `<line class="base" x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}" style="stroke-dasharray:none"/></svg>`;
    el.innerHTML = s;
  };
  draw();
  let raf; new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }).observe(el);
}

/* ------------------------------------------------------------------ */
/* En-tête                                                             */
/* ------------------------------------------------------------------ */
function renderHeader() {
  const s = D.site, sy = D.marche.synthese || {};
  document.getElementById("nom").textContent = s.nom;
  document.getElementById("role").textContent = s.titre;
  document.getElementById("pitch").textContent = s.accroche;
  const ecart = sy.perf_pct != null && sy.perf_benchmark_pct != null ? sy.perf_pct - sy.perf_benchmark_pct : null;
  document.getElementById("vlcard").innerHTML = `
    <div class="eyebrow">Depuis le lancement · ${dfr(s.date_lancement)}</div>
    <div class="big ${cls(sy.perf_pct)}">${pct(sy.perf_pct, 2)}</div>
    <div class="vs">${esc(s.benchmark_nom)} <b>${pct(sy.perf_benchmark_pct, 2)}</b></div>
    <div class="vs">Écart <b class="${cls(ecart)}">${ecart == null ? "—" : (ecart > 0 ? "+" : "") + fmt(ecart, 2) + " pt"}</b></div>
    <div class="asof">Cours au ${dfr(D.marche.maj)}, mis à jour automatiquement</div>`;
  const demo = [D.portfolio, D.journal, D.marche, D.backtest].some(x => x && x.exemple);
  if (demo) {
    document.getElementById("demo").hidden = false;
    document.getElementById("demo-txt").textContent = "Positions, cours et backtest sont fictifs et servent à illustrer la présentation. Ils seront remplacés avant la mise en ligne.";
  }
  document.getElementById("footer-txt").textContent =
    `Portefeuille modèle fictif, à vocation pédagogique. L'auteur ne détient aucune des positions présentées. Ce site ne constitue ni un conseil en investissement, ni une recommandation d'achat ou de vente, ni une sollicitation. Les performances passées, réelles ou simulées, ne préjugent pas des performances futures. Opinions personnelles de l'auteur, qui n'engagent aucun employeur. © ${new Date().getFullYear()} ${s.nom}.`;
  document.title = `${s.nom} · Portefeuille modèle`;
}

/* ------------------------------------------------------------------ */
/* Portefeuille                                                        */
/* ------------------------------------------------------------------ */
function gemMini(p) {
  const g = notesGem(p);
  return `<span class="gem" aria-hidden="true">${g.map(v => `<i style="height:${(v / 5) * 100}%"></i>`).join("")}</span>`;
}
function renderPortefeuille() {
  const s = D.site, sy = D.marche.synthese || {}, c = D.marche.courbe || {};
  const pos = D.portfolio.positions || [];
  const ouvertes = pos.filter(p => p.statut !== "cloturee").sort((a, b) => (mk(b).poids_actuel_pct || 0) - (mk(a).poids_actuel_pct || 0));
  const closes = pos.filter(p => p.statut === "cloturee");
  const moy = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
  const ecartMoy = moy(pos.map(p => { const e = rdtExige(gemTotal(p)), i = rdtImplicite(p); return e != null && i != null ? i - e : null; }).filter(v => v != null));
  const gemMoy = moy(pos.map(gemTotal));
  const v = document.getElementById("v-portefeuille");

  const row = p => {
    const m = mk(p), r = regles(p);
    return `<tr class="clickable" tabindex="0" data-fiche="${esc(p.ticker)}" aria-label="Ouvrir la fiche ${esc(p.nom)}">
      <td class="c-co"><div class="co"><b>${esc(p.nom)}</b><small><span class="tk">${esc(p.ticker)}</span> · ${esc(p.pays)} · ${esc(p.secteur)}</small></div></td>
      <td class="n" data-label="Exécution">${dfr(m.jour_execution || p.date_entree)}<span class="sub num">PRU ${prix(m.pru ?? m.cours_execution ?? p.cours_entree, p.devise)}</span>${(m.nb_mouvements || 1) > 1 ? `<span class="sub">${m.nb_mouvements} tranches</span>` : ""}</td>
      <td class="n" data-label="${p.statut === "cloturee" ? "Sortie" : "Cours"}">${p.statut === "cloturee" ? `${dfr(m.jour_sortie || p.date_sortie)}<span class="sub num">${prix(m.cours_sortie_marche ?? p.cours_sortie, p.devise)}</span>` : `<span class="num">${prix(m.cours_actuel, p.devise)}</span>`}</td>
      <td class="n" data-label="Performance"><span class="num ${cls(m.perf_locale_pct)}">${pct(m.perf_locale_pct)}</span><span class="sub num">${pct(m.perf_base_pct)} en ${esc(s.devise_portefeuille)}</span></td>
      ${p.statut === "cloturee" ? `<td class="n num ${cls(m.contribution_pct)}" data-label="Contribution">${pct(m.contribution_pct, 2)}</td>` : `<td class="n num" data-label="Poids">${fmt(m.poids_actuel_pct, 1)} %</td>`}
      <td class="n num" data-label="Rdt implicite">${rdtImplicite(p) == null ? "—" : fmt(rdtImplicite(p), 1) + " %"}<span class="sub">exigé ${rdtExige(gemTotal(p)) ?? "—"} %</span></td>
      <td class="n" data-label="Gem /20" style="white-space:nowrap">${gemMini(p)}<span class="num">${fmtG(gemTotal(p))}</span></td>
      <td data-label="Règles"><span class="checks">${r.map(x => `<span class="check ${x.ok ? "" : "ko"}" title="${esc(x.lbl)}">${x.ok ? "✓" : "✕"}</span>`).join("")}</span></td>
    </tr>`;
  };
  const head = (closed) => `<thead><tr>
      <th>Société</th><th class="n">Exécution</th><th class="n">${closed ? "Sortie" : "Cours"}</th><th class="n">Performance</th>
      <th class="n">${closed ? "Contribution" : "Poids"}</th><th class="n" title="Rendement implicite du cours d'entrée, selon le reverse DCF">Rdt implicite</th>
      <th class="n">Gem /20</th><th>Règles</th></tr></thead>`;

  v.innerHTML = `
    <div class="kpis">

let dernierFocus = null;
function ouvrirFiche(ticker, pousser = true) {
  const p = (D.portfolio.positions || []).find(x => x.ticker === ticker);
  if (!p) return;
  const s = D.site, m = mk(p), r = regles(p), g = gemTotal(p);
  const notes = notesGem(p), exig = rdtExige(g), impl = rdtImplicite(p);
  const exec = m.cours_execution ?? p.cours_entree, pru = m.pru ?? exec;
  const pmax = +p.prix_entree_max || null, vi = +p.valeur_intrinseque || null;
  const pts = [exec, pmax, vi, m.cours_actuel].filter(v => v > 0);
  const hi = Math.max(...pts) * 1.06, lo = Math.min(...pts) * .9;
  const xp = v => ((v - lo) / (hi - lo) * 100).toFixed(2) + "%";
  const mvts = m.mouvements || [];
  const hist = (D.journal.entrees || []).filter(e => e.ticker === p.ticker).sort((a, b) => a.date.localeCompare(b.date));
  const dr = document.getElementById("drawer");
  dr.innerHTML = `
    <div class="drawer-head">
      <div><span class="eyebrow">${p.statut === "cloturee" ? "Position clôturée" : "En portefeuille"} · ${esc(p.archetype)}</span>
        <h2 id="fiche-titre">${esc(p.nom)}</h2>
        <div class="meta"><span class="tk">${esc(p.ticker)}</span> · ${esc(p.pays)} · ${esc(p.secteur)}</div></div>
      <button class="close" id="close" aria-label="Fermer la fiche">×</button>
    </div>
    <div class="facts">
      <div class="fact"><span class="k">${mvts.length > 1 ? "Prix de revient" : "Exécution"}</span><span class="v">${prix(pru, p.devise)}</span><span class="k">${mvts.length > 1 ? mvts.length + " tranches depuis le " : ""}${dfr(m.jour_execution || p.date_entree)}</span></div>
      <div class="fact"><span class="k">${p.statut === "cloturee" ? "Sortie" : "Cours actuel"}</span><span class="v">${prix(p.statut === "cloturee" ? (m.cours_sortie_marche ?? p.cours_sortie) : m.cours_actuel, p.devise)}</span><span class="k">${dfr(p.statut === "cloturee" ? (m.jour_sortie || p.date_sortie) : D.marche.maj)}</span></div>
      <div class="fact"><span class="k">Performance</span><span class="v ${cls(m.perf_locale_pct)}">${pct(m.perf_locale_pct)}</span><span class="k">${pct(m.perf_base_pct)} en ${esc(s.devise_portefeuille)}</span></div>
      <div class="fact"><span class="k">Rendement implicite</span><span class="v">${impl == null ? "—" : fmt(impl, 1) + " %"}</span><span class="k">au cours de ${prix(+p.cours_dcf || exec, p.devise)}</span></div>
      <div class="fact"><span class="k">Rendement exigé</span><span class="v">${exig == null ? "—" : exig + " %"}</span><span class="k">pour un Gem de ${fmtG(g)}/20</span></div>
      <div class="fact"><span class="k">${p.statut === "cloturee" ? "Contribution" : "Poids actuel"}</span><span class="v">${p.statut === "cloturee" ? pct(m.contribution_pct, 2) : fmt(m.poids_actuel_pct, 1) + " %"}</span></div>
    </div>

    ${p.statut === "cloturee" && p.motif_sortie ? `<div class="block"><h3>Motif de sortie</h3><div class="exit"><p>${esc(p.motif_sortie)}</p></div></div>` : ""}

    <div class="block"><h3>Thèse</h3><p>${esc(p.these)}</p></div>

    <div class="block"><h3>Valorisation</h3>
      ${pmax ? `<div class="scale" aria-hidden="true">
        <div class="track"></div>
        <div class="zone" style="left:0;width:${xp(pmax)}"></div>
        ${vi ? `<div class="mk th" style="left:${xp(vi)}"><span>Valeur à ${fmt(s.taux_actualisation_pct ?? 8.5, 1)} %</span><i></i></div>` : ""}
        <div class="mk" style="left:${xp(exec)}"><span>Entrée</span><i></i></div>
        <div class="mk th lbl-below" style="left:${xp(pmax)}"><i></i><span>Prix max.</span></div>
      </div>` : ""}
      <p class="scale-caption">${pmax ? `Zone verte : cours qui offrent au moins le rendement exigé de ${exig ?? "—"} %, soit un prix d'entrée maximal de ${prix(pmax, p.devise)}. ` : ""}${esc(p.methode_valo || "")}</p>
    </div>
    ${mvts.length ? `<div class="block"><h3>Exécutions</h3><div class="gem-rows">${mvts.map(x => `<div class="gem-row" style="grid-template-columns:90px minmax(0,1fr) auto"><span class="num muted">${dfr(x.date)}</span><span>${esc(x.type)}${x.poids_pct != null ? ` · ${fmt(x.poids_pct, 2)} % du capital` : ""}${x.part_vendue_pct != null ? ` · ${fmt(x.part_vendue_pct, 0)} % de la ligne` : ""}</span><span class="num">${prix(x.cours, p.devise)}</span></div>`).join("")}</div></div>` : ""}

    <div class="block"><h3>Gem framework</h3>
      <div class="gem-rows">
        ${s.piliers_gem.map((nom, i) => `<div class="gem-row"><span>${esc(nom)}</span><span class="bar">${[1,2,3,4,5].map(k => `<i class="${k <= notes[i] ? "on" : ""}"></i>`).join("")}</span><span class="num">${fmt(notes[i], Number.isInteger(notes[i]) ? 0 : 2)}/5</span></div>`).join("")}
        <div class="gem-total"><span>Total</span><span class="num">${fmtG(g)}/20</span></div>
      </div>
    </div>

    <div class="block"><h3>Conditions d'achat</h3>
      <div class="gem-rows">${r.map(x => `<div class="gem-row" style="grid-template-columns:24px minmax(0,1fr)"><span class="check ${x.ok ? "" : "ko"}">${x.ok ? "✓" : "✕"}</span><span>${esc(x.lbl)}</span></div>`).join("")}</div>
    </div>

    ${(p.catalyseurs || []).length ? `<div class="block"><h3>Catalyseurs</h3><ul class="plain">${p.catalyseurs.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
    ${(p.invalidation || []).length ? `<div class="block"><h3>La thèse est invalidée si</h3><ul class="plain invalid">${p.invalidation.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
    ${p.note_url ? `<div class="block"><a class="btn" href="${esc(p.note_url)}" target="_blank" rel="noopener">Lire la note de recherche complète ↗</a></div>` : ""}
    ${hist.length ? `<div class="block"><h3>Historique</h3><div class="gem-rows">${hist.map(e => `<div class="gem-row" style="grid-template-columns:90px minmax(0,1fr)"><span class="num muted">${dfr(e.date)}</span><span><b style="font-weight:600">${esc(e.type)}</b> · ${esc(e.texte)}</span></div>`).join("")}</div></div>` : ""}
  `;
  dernierFocus = document.activeElement;
  dr.hidden = false; document.getElementById("backdrop").hidden = false;
  document.body.style.overflow = "hidden";
  dr.scrollTop = 0;
  document.getElementById("close").focus();
  document.getElementById("close").onclick = () => fermerFiche();
  if (pousser) history.pushState(null, "", "#f-" + slug(p.ticker));
}
function fermerFiche(pousser = true) {
  const dr = document.getElementById("drawer");
  if (dr.hidden) return;
  dr.hidden = true; document.getElementById("backdrop").hidden = true;
  document.body.style.overflow = "";
  if (pousser) history.pushState(null, "", "#" + (vueCourante || "portefeuille"));
  if (dernierFocus) dernierFocus.focus();
}

let filtreJournal = "Tout";
function renderJournal() {
  const v = document.getElementById("v-journal");
  const e = (D.journal.entrees || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  const types = ["Tout", "Entrée", "Renforcement", "Allègement", "Sortie", "Écarté", "Note"].filter(t => t === "Tout" || e.some(x => x.type === t));
  const liste = filtreJournal === "Tout" ? e : e.filter(x => x.type === filtreJournal);
  const tickers = new Set((D.portfolio.positions || []).map(p => p.ticker));
  const tcls = t => ({ "Entrée": "t-entree", "Renforcement": "t-entree", "Sortie": "t-sortie", "Allègement": "t-sortie", "Écarté": "t-ecarte" }[t] || "");
  let html = "", mois = "";
  liste.forEach(x => {
    const k = x.date.slice(0, 7);
    if (k !== mois) { html += `<div class="month">${MOIS[+k.slice(5) - 1]} ${k.slice(0, 4)}</div>`; mois = k; }
    html += `<article class="entry">
      <div class="date">${dfr(x.date)}</div>
      <div><span class="type ${tcls(x.type)}">${esc(x.type)}</span></div>
      <div><h3>${esc(x.titre)}${x.ticker ? `<span class="tk">${esc(x.ticker)}</span>` : ""}</h3><p>${esc(x.texte)}</p>
      ${x.ticker && tickers.has(x.ticker) ? `<button class="linkish" data-fiche="${esc(x.ticker)}">Voir la fiche</button>` : ""}</div>
    </article>`;
  });
  const repo = D.site.depot_github;
  v.innerHTML = `
    <div>
      <div class="sec-head"><h2>Journal des décisions</h2>
        <p class="proof">${repo ? `Chaque décision est horodatée. <a href="https://github.com/${esc(repo)}/commits/main/data" target="_blank" rel="noopener">Historique des modifications sur GitHub ↗</a>` : "Chaque décision est horodatée et aucune entrée n'est modifiée après coup."}</p></div>
      <p class="lede" style="margin-bottom:18px">Le journal recense toutes les décisions, y compris les dossiers écartés et les raisons de leur rejet. Une erreur se corrige par une nouvelle entrée datée, jamais en réécrivant l'ancienne.</p>
      <div class="filters" role="group" aria-label="Filtrer par type">${types.map(t => `<button class="chip" aria-pressed="${t === filtreJournal}" data-filtre="${esc(t)}">${esc(t === "Écarté" ? "Écartés" : t === "Tout" ? "Toutes les décisions" : t + "s")}</button>`).join("")}</div>
    </div>
    ${liste.length ? `<div class="timeline">${html}</div>` : `<div class="empty">Aucune entrée de ce type.</div>`}`;
}

  const ms = b.metriques.strategie, mb = b.metriques.benchmark;
  const nS = esc(b.nom_strategie || "Stratégie"), nB = esc(b.nom_benchmark || "Benchmark");
  const cv = b.couverture;
  const comp = b.comparaisons || [];
  const lignes = [
    ["Rendement annualisé (CAGR)", ms.cagr_pct, mb.cagr_pct, v => pct(v, 1)],
    ["Performance cumulée", ms.perf_totale_pct, mb.perf_totale_pct, v => pct(v, 0)],
    ["Volatilité annualisée", ms.volatilite_pct, mb.volatilite_pct, v => fmt(v, 1) + " %"],
    [`Ratio de Sharpe (taux sans risque ${fmt(b.metriques.taux_sans_risque_pct, 1)} %)`, ms.sharpe, mb.sharpe, v => fmt(v, 2)],

    ["Ratio d'information", ms.ratio_information, null, v => v == null ? "" : fmt(v, 2)],

        <p class="rule-note" style="margin-top:14px">Univers : ${esc(b.univers || "")}</p>
      </div>
    </div>
    <div>
      <div class="sec-head"><h2>Valeur liquidative simulée</h2><p>Base 100${b.devise ? ", en " + (b.devise === "USD" ? "dollars" : esc(b.devise)) : ""}</p></div>
      <div class="chart-box"><div class="legend"><span><i></i>${nS}</span><span><i class="b"></i>${nB}</span></div><div class="chart" id="ch-bt"></div></div>
    </div>
    ${comp.length ? `<div>
      <div class="sec-head"><h2>Comparaisons</h2><p>Même période, mêmes frais</p></div>
      <div class="table-scroll"><table>
        <thead><tr><th></th><th class="n">CAGR</th><th class="n">Volatilité</th><th class="n">Sharpe</th><th class="n">Drawdown max.</th></tr></thead>

          <td class="n num">${pct(c.cagr_pct, 1)}</td><td class="n num">${fmt(c.volatilite_pct, 1)} %</td><td class="n num">${fmt(c.sharpe, 2)}</td><td class="n num">${pct(c.drawdown_max_pct, 1, false)}</td></tr>`).join("")}</tbody>
      </table></div>

    </div>` : ""}
    <div class="two">

    <div class="steps">
      ${step(1, "Univers et filtres de base", `
        <p>Quinze pays : États-Unis, Canada, France, Allemagne, Pays-Bas, Royaume-Uni, Irlande, Suisse, Suède, Danemark, Norvège, Finlande, Italie, Espagne et Japon. Capitalisation d'au moins 1 milliard d'euros, volume quotidien moyen supérieur à 3 millions d'euros, au moins huit ans d'historique.</p>
        <p style="margin-top:8px">Les exclusions sectorielles ont été abandonnées : elles écartaient Visa, Mastercard, Moody's ou MSCI, rangés dans la finance alors que ce sont des franchises de données très rentables, et laissaient passer des cycliques déguisées en industrielles. Quatre règles fondées sur le modèle économique les remplacent.</p>
        ${t(["Règle", "Seuil", "Ce qu'elle écarte"], [
          ["R1 · Rotation du capital tangible", "≥ 0,40", "Modèles à spread de bilan : banques, assurance, foncières"],
          ["R2 · Volatilité de marge (dérive 3 ans contre 10 ans)", "≤ 0,35", "Preneurs de prix : mines, pétrole, chimie de base"],
          ["R3 · Intensité capitalistique (capex / CA)", "≤ 25 %", "Infrastructures régulées, utilities"],
          ["R4 · Profitabilité établie", "EBIT positif 4 ans sur 5", "Sociétés sans revenus, biotechs en développement"],
        ], ["", "num", ""])}
        ${sub("Filtres du screener")}
        <p>Ce qui est éliminé au screener est irrécupérable : les seuils y sont donc volontairement plus larges que les gates. Aucun filtre de valorisation à ce stade, sous peine d'éliminer mécaniquement les meilleures franchises.</p>
        ${t(["Critère", "Seuil"], [
          ["ROCE moyen sur 10 ans", "≥ 9 %"], ["Marge opérationnelle moyenne sur 10 ans", "≥ 5 %"], ["Marge brute moyenne sur 10 ans", "≥ 25 %"],
          ["Croissance annuelle du chiffre d'affaires sur 10 ans", "≥ 4 %"], ["Conversion FCF / résultat net", "−30 % à 320 %"],
        ], ["", "n num"])}
        <p class="rule-note">Ni goodwill / actif, ni couverture des intérêts au screener : ces champs sont vides pour les sociétés sans acquisition ou sans dette, et un champ vide y vaut échec. Fastenal et Keyence étaient éliminés parce que leur bilan était trop propre. Ces critères s'appliquent en aval, où une cellule vide vaut passage.</p>`)}

      ${step(2, "Gates discriminants", `
        <p>Appliqués dans le classeur, sur l'export du screener. Un gate en échec bloque le dossier ; une donnée manquante ou une valeur en zone grise l'envoie en quarantaine, c'est-à-dire en revue manuelle.</p>
        ${t(["Gate", "Règle", "Ce qu'il attrape"], [
          ["G1 · Rentabilité", "ROIC ajusté du goodwill ≥ 11 % <b>ou</b> ROCE sur 10 ans ≥ 18 %", "Rentabilité insuffisante, sans pénaliser les acquéreurs en série"],
          ["G2 · Stabilité", "Dérive de la marge opérationnelle, 3 ans contre 10 ans, ≤ 0,35", "Teladoc, Zoom, Peloton, Intel, Ubisoft. Aucun compounder ne dépasse 0,28."],
          ["G3 · Qualité du cash", "Conversion FCF / résultat net entre −30 % et 250 %, quarantaine de 250 à 350 %", "En bas : résultat dégradé. En haut : résultat écrasé par l'amortissement des acquisitions."],
        ])}
        <p class="rule-note">ROIC ajusté = ROIC moyen sur 5 ans ÷ (1 − goodwill / actif total). Sans correction, Roper ressort à 5,1 %, Dassault à 9,0 % et Halma à 12,5 %, tous sous Bayer à 10,6 %. Après ajustement : 13,0 %, 12,8 % et 21,0 %.</p>
        ${sub("D'où viennent ces seuils")}
        <p>La première version reprenait des seuils courants pour une stratégie de qualité. Le calibrage sur des dossiers réels a montré que chacun se trompait d'une façon précise.</p>
        ${t(["Seuil initial", "Ce que le calibrage a montré", "Remplacé par"], [
          ["ROCE &gt; 12 %", "Éliminait Halma, à 11,4 % : le goodwill des acquéreurs en série écrase le ratio brut.", "G1, ROIC ajusté du goodwill"],
          ["Marge opérationnelle &gt; 25 %", "Éliminait Fastenal, Bunzl et Ferguson : un distributeur vit de sa rotation, pas de sa marge.", "Marge ≥ 5 % au screener, stabilité en G2, seuils par archétype"],
          ["Croissance &gt; 10 % / an", "Laissait passer Teleperformance, à 12,1 %, et bloquait W.W. Grainger.", "Croissance ≥ 4 %, la qualité étant jugée par G1 à G3"],
          ["Dette nette / EBITDA &lt; 3x", "Éliminait MSCI et Roper, qui portent volontairement du levier sur des flux prévisibles, tout en restant trop laxiste pour un éditeur de logiciels.", "Seuils par archétype, de 1,5x à 2,5x, et veto de solvabilité à 4x"],
          ["Couverture des intérêts &gt; 5x", "Ratio absent pour les sociétés sans dette : les bilans les plus sains étaient éliminés.", "Veto V6 en aval, où un champ vide vaut passage"],
        ], ["num", "", ""])}
        ${sub("Les archétypes")}
        <p>Chaque dossier qui passe les gates reçoit un archétype, qui fixe ses seuils secondaires et oriente la lecture qualitative. Un seuil unique sur un univers hétérogène produit des erreurs dans les deux sens.</p>
        ${t(["", "A · Franchise asset-light", "B · Acquéreur en série", "C · Distributeur / réseau", "D · Marque & medtech"], [
          ["Exemples", "Microsoft, SAP, MSCI", "Halma, Diploma, Lifco, Roper", "Fastenal, Bunzl, Ferguson", "L'Oréal, Hermès, Novo Nordisk, Keyence"],
          ["Marge opérationnelle", "&gt; 25 %", "15 à 25 %", "5 à 12 %", "&gt; 18 %"],
          ["ROIC hors goodwill", "&gt; 25 %", "&gt; 20 %", "&gt; 20 %", "&gt; 20 %"],
          ["Dette nette / EBITDA", "&lt; 1,5x", "&lt; 2,5x", "&lt; 2,0x", "&lt; 2,0x"],
          ["Conversion FCF / résultat net", "&gt; 85 %", "&gt; 80 %", "&gt; 80 %", "&gt; 85 %"],
          ["Vigilance dominante", "Dilution, disruption", "Qualité des acquisitions", "BFR, pouvoir des fournisseurs", "Renouvellement de marque, réglementation"],
        ])}`)}

      ${step(3, "Pré-score et sélection", `
        <p>Un pré-score Gem sur 20 est calculé automatiquement pour chaque dossier qui passe les gates, à partir des seuls ratios. Les 50 à 60 premiers forment la file de travail, à raison d'un dossier par semaine.</p>
        <p style="margin-top:8px">Le pré-score classe, il ne décide pas. Au calibrage, Kraft Heinz obtenait 13,6/20 grâce à ses rachats et à son dividende, au-dessus de quatre compounders authentiques.</p>`)}

      ${step(4, "Vetos", `
        <p>Binaires et appliqués avant toute notation : un seul veto écarte le dossier, sans compensation possible. Ils existent parce qu'aucun ratio n'attrape une fraude ou un passif juridique : des comptes falsifiés sont cohérents par construction.</p>
        ${t(["Veto", "Déclencheur", "Source"], [
          ["V1 · Passif juridique", "Provisions et passifs éventuels &gt; 25 % de la capitalisation, ou contentieux de masse", "Rapport annuel"],
          ["V2 · Opacité", "Auditeur changé depuis moins de 3 ans, réserve, retraitement, faiblesse de contrôle interne", "Rapport annuel"],
          ["V3 · Trésorerie non vérifiable", "Plus de 30 % chez des tiers, sous séquestre ou non rapatriable", "Rapport annuel"],
          ["V4 · Dépendance client", "Un client &gt; 25 % du CA, ou les trois premiers &gt; 50 %", "Rapport annuel"],
          ["V5 · Dilution", "Actions +2 % par an sur 5 ans, avec une croissance du BPA inférieure ou égale à celle du CA", "Calculé"],
          ["V6 · Continuité", "Dette nette / EBITDA &gt; 4x, couverture des intérêts &lt; 2x, ou &lt; 1,5x après capex", "Calculé"],
        ])}
        <p class="rule-note">Un drapeau sur les accruals (test de Sloan) complète le dispositif sans être un veto : il signale où regarder.</p>`)}

      ${step(5, "Score Gem", `
        <p>Quatre piliers notés de 1 à 5. Chaque pilier reçoit une note d'ancrage calculée à partir des ratios, que l'analyse ajuste d'un point au plus, à partir de six questions binaires. L'ancrage garantit la reproductibilité ; la limite d'un point empêche le jugement de réécrire le score.</p>
        <div class="pillars">${s.piliers_gem.map((n, i) => `<div class="pillar"><b>${esc(n)}</b><span>${esc(piliers[i] || "")}</span></div>`).join("")}</div>
        ${t(["Score Gem", "Décision", "Rendement exigé"], [
          ["18 à 20", "Candidat prioritaire", "8 %"], ["16 à 17", "Candidat", "9 %"], ["15", "Candidat sous surveillance", "10 %"], ["Moins de 15", "Écarté", "—"],
        ], ["num", "", "num"])}
        <p class="rule-note">Plancher : aucun pilier sous ${s.plancher_pilier ?? 3}, quel que soit le total. Le rendement exigé baisse quand la qualité augmente, car la prévision est plus fiable. Une exigence uniforme conduit à acheter les moins bons dossiers de la liste, puisque les meilleurs n'offrent jamais un rendement aussi élevé.</p>`)}

      ${step(6, "Reverse DCF et prix d'entrée", `
        <p>Un DCF classique produit un prix cible faussement précis, qu'on ajuste inconsciemment jusqu'au résultat souhaité. Le reverse DCF pose une question : quelle croissance le cours exige-t-il, et est-elle défendable au regard de ce que la société a réalisé ? Si le marché exige plus que l'historique, on paie une amélioration qui n'a pas eu lieu.</p>
        <p style="margin-top:8px">Projection du free cash flow sur 10 ans : croissance des années 1 à 5 égale au plus faible de la croissance du chiffre d'affaires et du BPA sur dix ans, plafonnée à 12 % ; convergence linéaire vers 2 % sur les années 6 à 10 ; valeur terminale à 2 %. Le FCF de départ est audité à partir du tableau de flux avant toute décision.</p>
        ${t(["Sortie du modèle", "Lecture"], [
          ["Rendement implicite", "Taux d'actualisation qui égalise la valeur par action et le cours. C'est le rendement annuel que le cours promet si les hypothèses se réalisent."],
          ["Rendement exigé", "8, 9 ou 10 % selon le score Gem. Il remplace la marge de sécurité : la qualité réduit l'exigence."],
          ["Prix d'entrée maximal", "Cours qui donne exactement le rendement exigé. L'ordre d'achat est limité à ce prix."],
          ["Croissance implicite / réalisée", "Au-delà de 1,5x, le marché paie une accélération qui n'a pas eu lieu : c'est le déclencheur d'allègement de la discipline de vente."],
        ])}
        <p class="rule-note">Taux d'actualisation de référence unique à ${fmt(s.taux_actualisation_pct ?? 8.5, 1)} % (environ 3 % sans risque et 5,5 % de prime actions), révisé une fois par an et jamais dossier par dossier. Si le cours a bougé de ${s.ecart_recalcul_pct ?? 10} % ou plus depuis le calcul, le reverse DCF est refait avant toute décision.</p>`)}

      ${step(7, "Momentum et dimensionnement", `
        <p>Le momentum dimensionne la position ; il n'autorise pas l'achat. Le rendement implicite s'améliore quand le cours baisse, le momentum se confirme quand il monte : en faire deux conditions cumulatives produit une liste d'attente permanente.</p>
        ${t(["Phase", "Définition", "Décision"], [
          ["A · Accélération", "Cours &gt; MM50 &gt; MM200, pente de la MM200 positive", "Ligne pleine, 4,5 % : moitié immédiatement, moitié trois semaines plus tard"],
          ["P · Pause", "MM50 &gt; MM200, cours repassé sous la MM50", "Tranche réduite, 1,5 % : solde au passage en A ou sous trois mois"],
          ["C · Controverse", "MM50 &lt; MM200, cours repassé au-dessus de la MM50", "Tranche réduite, 1,5 % : solde au passage en A ou sous trois mois"],
          ["B · Baisse", "Cours &lt; MM50 &lt; MM200, pente de la MM200 négative", "<b>Aucun achat</b>"],
        ])}
        <p class="rule-note">Moyennes sur cours quotidiens, relevé hebdomadaire sur la clôture du vendredi, confirmation sur deux relevés consécutifs avant tout changement de phase. Seule la phase B bloque : acheter dans une tendance baissière établie revient à parier sur un point bas inconnu.</p>`)}
    </div>

    <div class="two">
      <div>
        <div class="sec-head"><h2>Conditions d'achat</h2></div>
        <ol class="plain">
          <li>Dossier retenu au Gem : score d'au moins ${s.seuil_gem}/20, aucun pilier sous ${s.plancher_pilier ?? 3}, aucun veto.</li>
          <li>Rendement implicite du cours au moins égal au rendement exigé, soit un cours inférieur ou égal au prix d'entrée maximal.</li>
          <li>Phase de momentum autre que B.</li>
        </ol>
        <p class="rule-note">Ordre à cours limité, jamais au marché. Entrée en tranches à des dates fixées à l'avance, jamais en fonction du cours entre-temps : c'est ce qui empêche le « j'attends encore un peu ». Au plus une nouvelle position par semaine, dans l'ordre d'une file d'attente publiée à l'avance et classée par écart entre rendement implicite et rendement exigé ; la phase de momentum ne modifie pas cet ordre.</p>
      </div>
      <div>
        <div class="sec-head"><h2>Construction du portefeuille</h2></div>
        ${t(["Paramètre", "Valeur"], [
          ["Nombre de lignes", "15 (12 à 18)"], ["Ligne pleine", "4,5 %, atteinte en deux ou trois tranches"], ["Plafond au coût", "10 %"],
          ["Plafond après appréciation", "15 %"], ["Maximum par archétype", "25 %"], ["Maximum par devise", "40 %"],
        ], ["", "n num"])}
        <p class="rule-note">Un portefeuille Quality Growth reste un pari factoriel unique : ces titres corrèlent brutalement sur un choc de taux, comme en 2022. Benchmark : ${esc(s.benchmark_nom)}. Frais simulés de ${fmt(s.frais_transaction_pct, 2)} % par transaction.</p>
      </div>
    </div>

    <div>
      <div class="sec-head"><h2>Discipline de vente</h2><p>La cause détermine l'action. Priorité stricte : A, puis B, puis C, puis D.</p></div>
      ${t(["Cause", "Déclencheur", "Action"], [
        ["A · Thèse cassée", "Un veto se déclenche, un pilier Gem passe sous 3, le score passe sous 13, le ROIC ajusté baisse deux exercices de suite sous le seuil de l'archétype, ou la dérive de marge repasse au-dessus de 0,35", "<b>Sortie totale</b> sous 10 jours, sans considération de prix"],
        ["B · Valorisation extrême", "Croissance implicite supérieure à 1,5x la croissance réalisée sur 10 ans", "Allègement à 50 %"],
        ["", "Cours supérieur à 2x la valeur intrinsèque (valeur par action au taux de 8,5 %)", "Sortie totale"],
        ["C · Momentum", "Passage en phase B, sans déclencheur A ni B", "Réduction au tiers, jamais de sortie totale"],
        ["D · Taille", "Position au-delà de 15 % ou sous 2 %, archétype au-delà de 25 %, devise au-delà de 40 %", "Écrêtage à 10 %, renfort ou sortie, rééquilibrage"],
      ])}
      <p class="rule-note">Aucune vente dans les cinq séances qui suivent une publication, sauf cause A. Ni la hausse ni la baisse du cours ne sont à elles seules un motif de vente. Toute vente, comme toute décision de conserver malgré un déclencheur, est datée et motivée par écrit avant l'exécution.</p>
    </div>`;
}

      <div class="open-cases">
        <div class="case"><span class="eyebrow">Erreur acceptée</span><h3>Constellation Software</h3>
          <p>Bloqué à tort par la borne haute de la conversion FCF / résultat net : 288 %, pour une borne à 250 %. Chez un acquéreur en série de logiciels, l'amortissement des actifs acquis creuse le résultat sans toucher la trésorerie. Aucun réglage ne le sépare de Teleperformance, à 297 %, qui doit être bloqué. La grille l'envoie en quarantaine plutôt que de l'éliminer, et la revue manuelle substitue le ratio FCF / EBITDA.</p></div>
        <div class="case"><span class="eyebrow">Limite des chiffres</span><h3>Wirecard et 3M</h3>
          <p>Lors d'un calibrage intermédiaire sur les états financiers bruts, ces deux pièges ont passé les filtres. Wirecard affichait un ROIC supérieur à 40 % et une conversion de trésorerie proche de 100 %. Une fraude bien construite ou un risque de litige ne se lisent pas dans les ratios : c'est le rôle des vetos documentaires de l'analyse qualitative.</p></div>
        <div class="case"><span class="eyebrow">Limite des chiffres</span><h3>Kraft Heinz</h3>
          <p>Le déclin structurel d'une marque ne se lit pas dans les ratios d'allocation du capital : rachats et dividende donnent 13,6/20 d'ancrage, au-dessus de quatre compounders. Seules les questions du pilier moat, sur la part de marché et les hausses de prix, font barrage.</p></div>
        <div class="case"><span class="eyebrow">Limite connue</span><h3>Southern Copper</h3>
          <p>Un producteur de cuivre obtient 18,0 de pré-score : le cycle a été porteur sur toute la période mesurée, et la marge paraît stable. Un critère complémentaire sur les matières premières, fondé sur le pire exercice plutôt que sur la moyenne, reste à construire.</p></div>
        <div class="case"><span class="eyebrow">Un autre filtre</span><h3>Sartorius Stedim et Adyen</h3>
          <p>De très bons actifs, à un prix qui suppose une croissance irréaliste. La qualité ne suffit pas : c'est le reverse DCF qui les écarte, à l'étage 6.</p></div>
      </div>
    </div>`;
}

/* ------------------------------------------------------------------ */
/* À propos                                                            */
/* ------------------------------------------------------------------ */
function renderAPropos() {
  const s = D.site, v = document.getElementById("v-apropos");
  v.innerHTML = `
    <div class="about">
      <div style="display:grid;gap:22px;align-content:start">
        <div><div class="sec-head"><h2>Qui suis-je</h2></div><p class="lede">${esc(s.presentation)}</p></div>
        <div><div class="sec-head"><h2>Pourquoi un portefeuille modèle</h2></div>
          <p class="lede">Un portefeuille fictif permet d'appliquer la stratégie sans contrainte de compte réel, et de la montrer en entier : les positions, mais aussi les dossiers écartés et les raisons de chaque décision. Les règles d'exécution sont fixées à l'avance et chaque décision est horodatée, pour que le suivi puisse être vérifié.</p></div>
        <div><div class="sec-head"><h2>Avertissement</h2></div><p class="disclaimer">Portefeuille modèle fictif, à vocation pédagogique et de démonstration. L'auteur ne détient aucune des positions présentées. Ce site ne constitue ni un conseil en investissement, ni une recommandation d'achat ou de vente, ni une sollicitation à réaliser une opération sur un instrument financier. Les performances passées, réelles ou simulées, ne préjugent pas des performances futures. Les opinions exprimées sont personnelles et n'engagent aucun employeur.</p></div>
      </div>
      <div class="contact">
        <span class="eyebrow">Contact</span>
        ${s.email ? `<div class="row"><span class="muted">E-mail</span><div class="copy-row"><span class="mono" id="mail">${esc(s.email)}</span><button class="btn" id="copy">Copier</button></div></div>` : ""}
        ${s.linkedin ? `<div class="row"><span class="muted">LinkedIn</span><a href="${esc(s.linkedin)}" target="_blank" rel="noopener">${esc(s.linkedin.replace(/^https?:\/\/(www\.)?/, ""))}</a></div>` : ""}
        ${s.cv_url ? `<div><a class="btn" href="${esc(s.cv_url)}" target="_blank" rel="noopener">Consulter mon CV ↗</a></div>` : ""}
      </div>
    </div>`;
  const b = document.getElementById("copy");
  if (b) b.onclick = () => {
    const ok = () => { b.textContent = "Copié"; setTimeout(() => b.textContent = "Copier", 1600); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("mail")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
    try { navigator.clipboard.writeText(s.email).then(ok, fallback); } catch (e) { fallback(); }
  };
}

/* ------------------------------------------------------------------ */
/* Navigation                                                          */
/* ------------------------------------------------------------------ */
const VUES = ["portefeuille", "journal", "methode", "construction", "backtest", "apropos"];
const rendus = {};
const RENDER = { portefeuille: renderPortefeuille, journal: renderJournal, backtest: renderBacktest, methode: renderMethode, construction: renderConstruction, apropos: renderAPropos };
let vueCourante = null;
function montrer(vue) {
  vueCourante = vue;
  VUES.forEach(k => { document.getElementById("v-" + k).hidden = k !== vue; });
  document.querySelectorAll("nav.tabs a").forEach(a => {
    if (a.dataset.view === vue) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  if (!rendus[vue]) { RENDER[vue](); rendus[vue] = true; }
  const actif = document.querySelector(`nav.tabs a[data-view="${vue}"]`);
  if (actif) { const nav = actif.parentElement; nav.scrollTo({ left: Math.max(0, actif.offsetLeft - (nav.clientWidth - actif.offsetWidth) / 2) }); }
}
(() => {
  const nav = document.querySelector("nav.tabs"), wrap = nav && nav.parentElement;
  if (!nav) return;
  const maj = () => wrap.classList.toggle("fin", nav.scrollLeft + nav.clientWidth >= nav.scrollWidth - 4);
  nav.addEventListener("scroll", maj, { passive: true }); window.addEventListener("resize", maj); maj();
})();
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("f-")) {
    if (!vueCourante) montrer("portefeuille");
    const p = (D.portfolio.positions || []).find(x => slug(x.ticker) === h.slice(2));
    if (p) ouvrirFiche(p.ticker, false);
    return;
  }
  fermerFiche(false);
  montrer(VUES.includes(h) ? h : "portefeuille");
}

document.addEventListener("click", ev => {
  const f = ev.target.closest("[data-fiche]");
  if (f) { ouvrirFiche(f.dataset.fiche); return; }
  const c = ev.target.closest("[data-filtre]");
  if (c) { filtreJournal = c.dataset.filtre; renderJournal(); document.querySelector(`[data-filtre="${CSS.escape(filtreJournal)}"]`)?.focus(); return; }
  if (ev.target.id === "backdrop") fermerFiche();
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") fermerFiche();
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("tr[data-fiche]")) { ev.preventDefault(); ouvrirFiche(ev.target.dataset.fiche); }
});
window.addEventListener("popstate", route);
window.addEventListener("hashchange", route);

/* ------------------------------------------------------------------ */
/* Mesure d'audience (GoatCounter, optionnelle)                        */
/* ------------------------------------------------------------------ */
function audience(code) {
  if (!code) return;
  const ref = new URLSearchParams(location.search).get("ref");
  window.goatcounter = { path: () => location.pathname + (ref ? "?ref=" + encodeURIComponent(ref) : "") };
  const sc = document.createElement("script");
  sc.async = true; sc.src = "https://gc.zgo.at/count.js";
  sc.dataset.goatcounter = `https://${code}.goatcounter.com/count`;
  document.head.appendChild(sc);
}

/* ------------------------------------------------------------------ */
/* Démarrage                                                           */
/* ------------------------------------------------------------------ */
Promise.all(FICHIERS.map(f => fetch(`data/${f}.json`, { cache: "no-cache" })
  .then(r => r.ok ? r.json() : (f === "backtest" || f === "marche" ? {} : Promise.reject(new Error(f))))))
  .then(res => {
    FICHIERS.forEach((f, i) => D[f] = res[i] || {});
    D.marche.positions = D.marche.positions || {};
    renderHeader();
    route();
    audience(D.site.goatcounter);
  })
  .catch(err => {
    document.getElementById("v-portefeuille").innerHTML =
      `<div class="err">Impossible de charger les données (${esc(err.message)}.json). Vérifiez que le fichier existe dans le dossier data/ et que son contenu est un JSON valide.</div>`;
  });
})();
</script>
</body>
</html>
