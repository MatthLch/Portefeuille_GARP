# Configuration de l'interface d'administration (Pages CMS : https://app.pagescms.org)
# Chaque enregistrement dans l'interface crée un commit horodaté dans le dépôt GitHub.

content:
  # ------------------------------------------------------------------ #
  - name: portefeuille
    label: Positions
    type: file
    path: data/portfolio.json
    format: json
    fields:
      - name: exemple
        label: Données d'exemple (affiche le bandeau « Données d'exemple »)
        type: boolean
      - name: positions
        label: Positions
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{nom} · {ticker} · {statut}"
        fields:
          - { name: ticker, label: "Ticker Yahoo Finance (ex. CSU.TO, HLMA.L, MSFT, NOVO-B.CO)", type: string, required: true }
          - { name: nom, label: Société, type: string, required: true }
          - { name: pays, label: "Pays (code ISO : US, GB, DE…)", type: string }
          - { name: secteur, label: Secteur, type: string }
          - name: archetype
            label: Archétype
            type: select
            options:
              values: [Franchise asset-light, Acquéreur en série, Distributeur / réseau, Marques & medtech, Services B2B]
          - name: devise
            label: "Devise de cotation (GBX = pence, actions cotées à Londres)"
            type: select
            options:
              values: [EUR, USD, CAD, GBX, GBP, CHF, SEK, DKK, NOK, JPY]
          - name: date_entree
            label: Date d'exécution
            type: date
            options:
              format: yyyy-MM-dd
          - { name: cours_entree, label: "Cours de la première tranche (clôture du jour d'exécution, en devise de cotation)", type: number }
          - { name: poids_cible, label: "Première tranche (% du capital : 2,25 en phase A, 1,5 en phase P ou C)", type: number }
          - { name: cours_dcf, label: "Cours auquel le reverse DCF a été calculé", type: number }
          - { name: rendement_implicite_pct, label: "Rendement implicite à ce cours (%)", type: number }
          - { name: prix_entree_max, label: "Prix d'entrée maximal (cours donnant le rendement exigé)", type: number }
          - { name: valeur_intrinseque, label: "Valeur par action au taux de référence (facultatif)", type: number }
          - { name: methode_valo, label: Méthode de valorisation, type: string }
          - { name: gem_moat, label: "Gem 1 – Moat & pricing power (1 à 5)", type: number }
          - { name: gem_management, label: "Gem 2 – Management & allocation du capital (1 à 5)", type: number }
          - { name: gem_reinvestissement, label: "Gem 3 – Piste de réinvestissement (1 à 5)", type: number }
          - { name: gem_transparence, label: "Gem 4 – Transparence comptable (1 à 5)", type: number }
          - { name: vetos_ok, label: "Aucun veto déclenché (V1 à V6)", type: boolean }
          - name: phase
            label: "Phase de momentum à l'exécution (A ligne pleine, P/C tranche réduite, B aucun achat)"
            type: select
            options:
              values: [A, P, C, B]
          - name: mouvements
            label: "Renforcements et allègements"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{date} · {type} · {poids_pct}"
            fields:
              - name: date
                label: Date d'exécution
                type: date
                options:
                  format: yyyy-MM-dd
              - name: type
                label: Type
                type: select
                options:
                  values: [Renforcement, Allègement]
              - { name: poids_pct, label: "Renforcement : % du capital ajouté. Allègement : % de la ligne vendu (50 = moitié)", type: number }
              - { name: cours, label: "Cours de clôture du jour (contrôle, facultatif)", type: number }
              - { name: motif, label: Motif, type: text }
          - { name: these, label: Thèse (5 lignes environ), type: text }
          - { name: catalyseurs, label: Catalyseurs, type: string, list: true }
          - { name: invalidation, label: La thèse est invalidée si…, type: string, list: true }
          - name: statut
            label: Statut
            type: select
            options:
              values: [ouverte, cloturee]
          - name: date_sortie
            label: Date de sortie (si clôturée)
            type: date
            options:
              format: yyyy-MM-dd
          - { name: cours_sortie, label: Cours de sortie (si clôturée), type: number }
          - { name: motif_sortie, label: Motif de sortie, type: text }
          - { name: note_url, label: "Lien vers la note de recherche (PDF, facultatif)", type: string }

  # ------------------------------------------------------------------ #
  - name: journal
    label: Journal des décisions
    type: file
    path: data/journal.json
    format: json
    fields:
      - name: exemple
        label: Données d'exemple
        type: boolean
      - name: entrees
        label: Entrées du journal
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date} · {type} · {titre}"
        fields:
          - name: date
            label: Date
            type: date
            options:
              format: yyyy-MM-dd
          - name: type
            label: Type
            type: select
            options:
              values: [Entrée, Renforcement, Allègement, Sortie, Écarté, Note]
          - { name: ticker, label: Ticker (facultatif), type: string }
          - { name: titre, label: Titre, type: string }
          - { name: texte, label: Texte, type: text }

  # ------------------------------------------------------------------ #
  - name: site
    label: Profil et réglages
    type: file
    path: data/site.json
    format: json
    fields:
      - { name: nom, label: Nom, type: string }
      - { name: titre, label: Titre, type: string }
      - { name: accroche, label: Accroche (bandeau), type: text }
      - { name: presentation, label: Présentation (page À propos), type: text }
      - { name: email, label: E-mail, type: string }
      - { name: linkedin, label: URL LinkedIn, type: string }
      - { name: cv_url, label: URL du CV (PDF), type: string }
      - { name: depot_github, label: "Dépôt GitHub (ex. matthieu/portefeuille-garp)", type: string }
      - { name: goatcounter, label: "Code GoatCounter (ex. matthieu)", type: string }
      - name: date_lancement
        label: Date de lancement du portefeuille
        type: date
        options:
          format: yyyy-MM-dd
      - { name: capital_initial, label: Capital fictif initial, type: number }
      - { name: devise_portefeuille, label: Devise du portefeuille, type: string }
      - { name: frais_transaction_pct, label: Frais par transaction (%), type: number }
      - { name: benchmark_ticker, label: "Ticker Yahoo du benchmark (coté dans la devise du portefeuille)", type: string }
      - { name: benchmark_nom, label: Nom du benchmark, type: string }
      - { name: seuil_gem, label: Seuil Gem (/20), type: number }
      - { name: plancher_pilier, label: Note minimale par pilier, type: number }
      - name: rendements_exiges
        label: Rendement exigé selon le score Gem
        type: object
        list: true
        fields:
          - { name: score_min, label: Score Gem minimal, type: number }
          - { name: rendement_pct, label: Rendement exigé (%), type: number }
      - { name: taux_actualisation_pct, label: "Taux d'actualisation de référence (%)", type: number }
      - { name: ecart_recalcul_pct, label: "Écart de cours imposant de refaire le reverse DCF (%)", type: number }
      - { name: ligne_pleine_pct, label: "Ligne pleine (% du capital)", type: number }
      - { name: tranche_reduite_pct, label: "Tranche réduite (% du capital)", type: number }
      - { name: piliers_gem, label: Noms des 4 piliers Gem, type: string, list: true }
