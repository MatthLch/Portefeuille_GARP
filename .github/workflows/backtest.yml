name: Backtest EDGAR

# Lancement manuel uniquement (onglet Actions → Backtest EDGAR → Run workflow).
# Durée indicative : 1 à 2 heures.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: Vérifier l'identification SEC
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Ajoute le secret SEC_USER_AGENT (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: 1. Fondamentaux point-in-time (SEC EDGAR)
        run: python scripts/backtest/fondamentaux.py

      - name: 2. Cours (Yahoo Finance)
        run: python scripts/backtest/prix.py

      - name: 3. Simulation
        run: python scripts/backtest/moteur.py

      - name: Publier les résultats
        run: |
          git config user.name "backtest[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest.json data/backtest_courbe.csv
          if ! git diff --cached --quiet; then
            git commit -m "Backtest EDGAR du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Conserver les données intermédiaires (7 jours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-backtest
          path: |
            cache/fondamentaux.csv.gz
            cache/tickers.json
          retention-days: 7
          if-no-files-found: ignore
